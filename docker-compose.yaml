# ============================================
# Docker Compose - Habit Tracker Stack
# ============================================
# Ce fichier orchestre 3 services :
# - api      : API REST Node.js/Express
# - db       : Base de données PostgreSQL
# - adminer  : Interface web pour gérer la BDD
# ============================================

services:

  # --------------------------------------------
  # Service API - Node.js / Express
  # --------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: habit_tracker_api
    restart: unless-stopped
    ports:
      - "${API_PORT}:3000"
    environment:
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - habit_network

  # --------------------------------------------
  # Service DB - PostgreSQL
  # --------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: habit_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - habit_network

  # --------------------------------------------
  # Service Adminer - Interface web BDD
  # --------------------------------------------
  adminer:
    image: adminer:latest
    container_name: habit_tracker_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db
    networks:
      - habit_network

# ============================================
# Volumes - Persistance des données
# ============================================
volumes:
  postgres_data:
    driver: local

# ============================================
# Networks - Réseau interne des conteneurs
# ============================================
networks:
  habit_network:
    driver: bridge
